# CI-only isolated Prefect Server.
services:
  prefect-ci:
    build:
      context: .
      dockerfile: docker/Dockerfile.worker
    command: ["prefect", "server", "start", "--host", "0.0.0.0", "--port", "4200"]
    environment:
      PREFECT_API_URL: http://prefect-ci:4200/api
      PREFECT_UI_ENABLED: "false"
    networks: [backend]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:4200/api/health', timeout=3)"]
      interval: 5s
      timeout: 4s
      retries: 24
      start_period: 15s
  gateway:
    environment:
      PREFECT_API_URL: http://prefect-ci:4200/api
  worker:
    environment:
      PREFECT_API_URL: http://prefect-ci:4200/api
      PREFECT_WORKER_QUERY_SECONDS: "3"
