name: Verify
on:
  push:
    branches: [main, dev]
  pull_request:
jobs:
  tests:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install '.[gateway,dev]'
      - run: python -m compileall -q src
      - run: pytest -q
