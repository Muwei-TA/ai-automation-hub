[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-automation-hub"
version = "0.1.0"
description = "Self-hosted n8n → secure gateway → Prefect 3 → NAS/Mac/VPS worker automation"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["httpx>=0.27,<1", "pydantic>=2.6,<3"]

[project.optional-dependencies]
gateway = ["fastapi>=0.110,<1", "uvicorn>=0.29,<1"]
worker = ["prefect>=3.3,<4"]
dev = ["fastapi>=0.110,<1", "pytest>=8,<10", "pytest-cov>=5,<8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"
