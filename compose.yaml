name: ai-automation-hub
services:
  n8n-db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: n8n
      POSTGRES_DB: n8n
      POSTGRES_PASSWORD: ${N8N_DB_PASSWORD:?Set N8N_DB_PASSWORD in .env}
    volumes:
      - n8n-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U n8n -d n8n"]
      interval: 10s
      timeout: 5s
      retries: 6
    networks: [backend]

  n8n:
    image: ${N8N_IMAGE:-docker.n8n.io/n8nio/n8n:2.48.5}
    restart: unless-stopped
    depends_on:
      n8n-db: {condition: service_healthy}
    ports:
      - "127.0.0.1:${N8N_PORT:-5678}:5678"
    environment:
      DB_TYPE: postgresdb
      DB_POSTGRESDB_HOST: n8n-db
      DB_POSTGRESDB_PORT: "5432"
      DB_POSTGRESDB_DATABASE: n8n
      DB_POSTGRESDB_USER: n8n
      DB_POSTGRESDB_PASSWORD: ${N8N_DB_PASSWORD:?Set N8N_DB_PASSWORD in .env}
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY:?Set N8N_ENCRYPTION_KEY in .env}
      GENERIC_TIMEZONE: ${TZ:-Asia/Shanghai}
      TZ: ${TZ:-Asia/Shanghai}
      N8N_EDITOR_BASE_URL: ${N8N_EDITOR_BASE_URL:-http://localhost:5678}
      WEBHOOK_URL: ${WEBHOOK_URL:-http://localhost:5678/}
      N8N_SECURE_COOKIE: ${N8N_SECURE_COOKIE:-false}
      N8N_DIAGNOSTICS_ENABLED: "false"
      N8N_PERSONALIZATION_ENABLED: "false"
      N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS: "true"
    volumes:
      - n8n-data:/home/node/.n8n
    networks: [backend]

  gateway:
    build:
      context: .
      dockerfile: docker/Dockerfile.gateway
    restart: unless-stopped
    ports:
      - "127.0.0.1:${GATEWAY_PORT:-8099}:8099"
    environment:
      GATEWAY_API_KEY: ${GATEWAY_API_KEY:?Set GATEWAY_API_KEY in .env}
      GITEA_WEBHOOK_SECRET: ${GITEA_WEBHOOK_SECRET:-}
      PREFECT_API_URL: ${PREFECT_API_URL:?Set PREFECT_API_URL in .env}
      PREFECT_API_AUTH_STRING: ${PREFECT_API_AUTH_STRING:-}
    networks: [backend]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8099/healthz', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  # Optional local NAS Worker. Do NOT mount /var/run/docker.sock by default.
  worker:
    profiles: [worker]
    build:
      context: .
      dockerfile: docker/Dockerfile.worker
    restart: unless-stopped
    environment:
      PREFECT_API_URL: ${PREFECT_API_URL:?Set PREFECT_API_URL in .env}
      PREFECT_API_AUTH_STRING: ${PREFECT_API_AUTH_STRING:-}
      PREFECT_WORK_POOL: ${PREFECT_WORK_POOL:-nas-local}
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
      GITEA_BASE_URL: ${GITEA_BASE_URL:-}
      GITEA_TOKEN: ${GITEA_TOKEN:-}
      COMFYUI_BASE_URL: ${COMFYUI_BASE_URL:-}
      NOTIFY_WEBHOOK_URL: ${NOTIFY_WEBHOOK_URL:-}
      LLM_BASE_URL: ${LLM_BASE_URL:-}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_MODEL: ${LLM_MODEL:-}
      HEALTH_URLS: ${HEALTH_URLS:-}
      HEALTH_DISK_PATH: ${HEALTH_DISK_PATH:-}
      DOCKER_SOCKET: ${DOCKER_SOCKET:-}
    command: ["sh", "-c", "exec prefect worker start --pool \"$$PREFECT_WORK_POOL\" --type process"]
    networks: [backend]

volumes:
  n8n-postgres:
  n8n-data:

networks:
  backend:
    driver: bridge
